name: CI

on:
  pull_request:
    branches:
      - main
      - prod
  push:
    branches:
      - main
      - prod

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Show Docker version
        run: docker version

      - name: Run tests
        run: npm run test
